databaseChangeLog:
  - changeSet:
      id: 06102026_create_users_table
      author: Subhan-Valili
      changes:
        - createTable:
            tableName: users
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: surname, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: email, type: VARCHAR(255), constraints: { nullable: false, unique: true } }
              - column: { name: password, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: mobile_number, type: VARCHAR(20), constraints: { nullable: false, unique: true } }
              - column: { name: pin_code, type: VARCHAR(100), constraints: { nullable: false, unique: true } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP }