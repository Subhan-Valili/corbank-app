server:
  port: 8083

spring:
  application:
    name: abb-bank-service

  # Own database, separate from every other microservice — Postgres, run via docker-compose
  # (see docker-compose.yml). Every value below is env-var driven so the same image works
  # both under `docker compose up` (which sets these to match the "db" service) and against
  # any other Postgres instance by just setting the same env vars.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:abb_bank_service}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:abb}
    password: ${DB_PASSWORD:abb}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

# --- ABB Bank Business API (B2B Integration REST API v1.6) ------------------------------
# Values from the doc's sandbox host; fill in the username/password ABB issued you.
abb:
  api:
    base-url: ${ABB_API_BASE_URL:https://api-test-c2b.abb-bank.az}
    username: ${ABB_API_USERNAME:}
    password: ${ABB_API_PASSWORD:}
    connect-timeout-ms: 5000
    read-timeout-ms: 15000

logging:
  level:
    az.corbank.abb: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
