# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# or:            SPRING_PROFILES_ACTIVE=h2 java -jar abb-bank-service.jar
#
# Swaps the Postgres datasource for an in-memory H2 instance, so you can run the service
# without Docker/Postgres at all while iterating locally. Data does NOT persist across restarts
# in this mode (unlike the Postgres profile) — it's for quick manual testing only.
spring:
  datasource:
    url: jdbc:h2:mem:abb-bank-service;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
