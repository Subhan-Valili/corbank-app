version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: pasha_db
    environment:
      POSTGRES_DB: pasha_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: