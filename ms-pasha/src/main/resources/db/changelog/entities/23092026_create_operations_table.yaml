databaseChangeLog:
  - changeSet:
      id: 23092026_create_operations_table
      author: Subhan-Valili
      changes:
        - createTable:
            tableName: account_operations
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP }

              - column: { name: external_id, type: VARCHAR(255), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_operation_external_id } }
              - column: { name: amount_value, type: "DECIMAL(15,2)", constraints: { nullable: false } }
              - column: { name: amount_currency_code, type: VARCHAR(3), constraints: { nullable: false } }
              - column: { name: counterparty_id, type: VARCHAR(255) }
              - column: { name: counterparty_name, type: VARCHAR(255) }
              - column: { name: operation_date, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: description, type: VARCHAR(1000) }
              - column: { name: source, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: type, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: pasha_account_id, type: BIGINT, constraints: { nullable: false } }

        - createIndex:
            indexName: idx_operation_external_id
            tableName: account_operations
            columns:
              - column: { name: external_id }

        - createIndex:
            indexName: idx_operation_account_id
            tableName: account_operations
            columns:
              - column: { name: pasha_account_id }

        - createIndex:
            indexName: idx_operation_date
            tableName: account_operations
            columns:
              - column: { name: operation_date }